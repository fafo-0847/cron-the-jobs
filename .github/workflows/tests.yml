name: tests

on:
  push:
    branches-ignore:
      - main
  pull_request: {}
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
          playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q tests
